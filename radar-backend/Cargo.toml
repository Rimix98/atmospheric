[package]
name = "atmospheric-radar"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "RainViewer radar for the atmospheric overlay: network + PNG decode outside QML"

[dependencies]
ureq = { version = "3", features = ["json"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
