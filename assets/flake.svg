<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Snowflake: 6 rays with twigs, one ray repeated by rotation.
       24x24 square — ImageParticle scales the image to a square of
       the particle size, proportions are kept at any size. -->
  <g fill="none" stroke="#ffffff" stroke-width="1.4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 12 L12 2.6 M10.3 7.4 L12 9.3 L13.7 7.4" transform="rotate(0 12 12)"/>
    <path d="M12 12 L12 2.6 M10.3 7.4 L12 9.3 L13.7 7.4" transform="rotate(60 12 12)"/>
    <path d="M12 12 L12 2.6 M10.3 7.4 L12 9.3 L13.7 7.4" transform="rotate(120 12 12)"/>
    <path d="M12 12 L12 2.6 M10.3 7.4 L12 9.3 L13.7 7.4" transform="rotate(180 12 12)"/>
    <path d="M12 12 L12 2.6 M10.3 7.4 L12 9.3 L13.7 7.4" transform="rotate(240 12 12)"/>
    <path d="M12 12 L12 2.6 M10.3 7.4 L12 9.3 L13.7 7.4" transform="rotate(300 12 12)"/>
    <circle cx="12" cy="12" r="1.3" fill="#ffffff" stroke="none"/>
  </g>
</svg>
