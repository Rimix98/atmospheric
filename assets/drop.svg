<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- квадрат 24x24 с тонкой вертикальной линией по центру:
       ImageParticle масштабирует картинку в квадрат размера частицы,
       поэтому пропорции капли сохраняются при любом size -->
  <rect x="11" y="1" width="2" height="22" rx="1" fill="url(#g)"/>
</svg>
